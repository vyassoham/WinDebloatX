name: Build & Release WinDebloatX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          python -m pytest tests/

      - name: Compile Standalone Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --uac-admin --name "WinDebloatX" --icon "assets/icon.ico" --add-data "locales;locales" --add-data "assets;assets" --collect-all customtkinter --hidden-import "rich" --hidden-import "PIL" --hidden-import "psutil" main.py

      - name: Create Portable Zip & Compute SHA-256 Checksum
        run: |
          Compress-Archive -Path "dist/WinDebloatX" -DestinationPath "dist/WinDebloatX-Portable.zip"
          $hash = (Get-FileHash -Path "dist/WinDebloatX-Portable.zip" -Algorithm SHA256).Hash
          "$hash  WinDebloatX-Portable.zip" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Generated SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/WinDebloatX-Portable.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
